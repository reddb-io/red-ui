[package]
name = "red-ui"
version = "0.8.8"
description = "reddb universal client"
authors = ["reddb-io"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "red_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
# Rust-side HTTP so the webview can reach a file-backed/local reddb that emits
# no CORS headers (the cross-origin webview fetch would be blocked otherwise).
tauri-plugin-http = "2"
# Native OS file picker for the desktop "Open database file…" flow (#123).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "process", "time", "sync"] }
anyhow = "1"
# OS keychain bridge for the EncryptedStore. macOS → Keychain Services,
# Windows → Credential Manager, Linux → libsecret via the Secret Service API.
sha2 = "0.10"
getrandom = "0.4"
zeroize = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Headless validation of the real runtime/keychain/private-binary lifecycle.
workspace-persistence-smoke = []
