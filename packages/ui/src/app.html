<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the persisted Color Scheme before paint to avoid a flash of the
      // wrong one. Default is light; dark is opt-in via the topbar toggle /
      // Cmd-K command. The DS reads `data-theme` as its Theme direction
      // (always "application" here) and `data-color-scheme` as light/dark.
      (function () {
        var root = document.documentElement;
        root.dataset.theme = "application";
        try {
          var t = localStorage.getItem("red-ui-theme");
          root.dataset.colorScheme = t === "dark" ? "dark" : "light";
        } catch (_) {
          root.dataset.colorScheme = "light";
        }
      })();
    </script>
    <title>red-ui</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
