name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
      - "LICENSE**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
      - "LICENSE**"

# Blacksmith-hosted runners (matching reddb-io/reddb's pattern) — same
# GitHub Actions semantics, dramatically faster boots and SSDs.

# Cost guard: a new push cancels older in-flight CI on the same ref. Release
# validation lives in release.yml; CI runs should stay quick (harvested from
# reddb-io/reddb).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Public repo — ubuntu-latest is free; this pnpm lane is light enough
    # that a paid Blacksmith runner buys nothing (cost policy, July 2026).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r check
      - run: pnpm -r test
      # Smoke build: catches TypeScript / Svelte compile errors that
      # `svelte-check` doesn't flag (e.g. a $effect feedback loop only
      # caught when the runtime is wired up).
      - run: pnpm --filter @reddb-io/ui build

      # icon.ico and icon.icns are container formats no Linux build ever opens,
      # so PNGs carrying those extensions sat in the tree until the first
      # Windows build failed on `RC2175: not in 3.00 format`. Check the magic
      # bytes on every PR instead of on every other platform's first release.
      # An invalid workflow file isn't a normal failure — GitHub creates a run
      # with zero jobs and no log, so a broken release.yml looks like "the
      # release didn't happen" rather than an error. That is exactly how a
      # `secrets` context in a step `if:` (not allowed there) reached a tag.
      # shellcheck integration is off: this gates workflow *validity*, and the
      # runner's shellcheck would also start failing CI on existing run blocks.
      - name: lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -shellcheck=

      - name: verify desktop icon formats
        run: |
          node -e '
            const fs = require("fs");
            const check = (p, magic, label) => {
              const head = fs.readFileSync(p).subarray(0, magic.length);
              if (!head.equals(Buffer.from(magic)))
                throw new Error(`${p} is not a ${label} (magic ${head.toString("hex")})`);
            };
            const dir = "apps/desktop/src-tauri/icons";
            check(`${dir}/icon.ico`, [0x00, 0x00, 0x01, 0x00], "Windows ICO");
            check(`${dir}/icon.icns`, [0x69, 0x63, 0x6e, 0x73], "macOS ICNS");
            console.log("icon formats ok");
          '

  tauri:
    # Verify the Rust shell still compiles on every PR; doesn't bundle
    # installers (that's the release workflow's job) — just runs
    # `cargo check` against the same workspace tauri-action will later use.
    # Cost policy (July 2026, Blacksmith bill): the slowest job runs
    # POST-MERGE on push to main only — never on an open PR. Rust shell
    # breakage surfaces after merge; release.yml still hard-gates on tags.
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # sccache object-cache; CARGO_INCREMENTAL must be 0 (incremental and
      # sccache are mutually exclusive). Harvested from reddb-io/reddb.
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `generate_context!()` validates `frontendDist` (packages/ui/build) at
      # compile time, so the SvelteKit bundle must exist before `cargo check`
      # — otherwise the proc macro panics with "this path doesn't exist".
      # release.yml builds the frontend ahead of the tauri step for the same
      # reason; mirror it here.
      - run: pnpm --filter @reddb-io/ui build
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Shared with release.yml's tauri job so the release build
          # warm-starts from CI's cache.
          shared-key: tauri-x86_64-unknown-linux-gnu-rust-1.95.0
          cache-on-failure: "true"
      - uses: ./.github/actions/tauri-linux-deps
      # The `red` sidecar (Tauri externalBin) is a ~15MB binary, gitignored
      # rather than committed. tauri-build validates `binaries/red-<triple>`
      # exists at compile time, so provision it before `cargo check`.
      # fetch-sidecar.sh downloads the pinned release asset for the host triple,
      # preferring the static musl build on Linux, and verifies the sha256.
      - name: provision red sidecar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-sidecar.sh
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: sccache stats
        if: always()
        run: sccache --show-stats
