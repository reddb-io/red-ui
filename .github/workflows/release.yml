name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Runners: Blacksmith-hosted, matching reddb-io/reddb's setup.
# 8vcpu for the heavy Rust+webview Tauri builds; 4vcpu elsewhere.
#
# Signing secrets (all optional — the workflow falls back to unsigned
# builds when a secret is missing):
#   TAURI_SIGNING_PRIVATE_KEY    — Tauri updater signing key (for autoUpdate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   APPLE_CERTIFICATE             — base64-encoded .p12 (Developer ID Application)
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY        — e.g. "Developer ID Application: …"
#   APPLE_ID                      — Apple ID for notarization
#   APPLE_PASSWORD                — app-specific password
#   APPLE_TEAM_ID
#   WINDOWS_CERTIFICATE           — base64-encoded .pfx
#   WINDOWS_CERTIFICATE_PASSWORD

# Never interrupt an in-flight release (a half-published tag is worse than a
# queued one), but don't run two releases for the same ref at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# npm publishing lives in changesets.yml (publishes on the Version Packages PR
# merge, github-hosted for provenance). release.yml is now binaries-only:
# tauri + pwa, triggered by a manually-pushed v* tag when you want a desktop/PWA
# release. This keeps npm with exactly one publisher (no double-publish).
jobs:
  # Preflight: verify the pinned reddb release has all required sidecar assets
  # before the Tauri build matrix starts. A missing asset fails here in seconds
  # rather than after each platform runner has warmed up and run Rust compilation.
  preflight:
    name: preflight · reddb assets
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: check reddb release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/preflight-release-assets.sh

  tauri:
    name: tauri · ${{ matrix.triple }}
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # One entry per shipped architecture. `triple` drives the sidecar
        # fetch, the rust-cache key, and (on macOS) the build target. Linux
        # aarch64 builds natively on a Blacksmith ARM runner rather than
        # cross-compiling — cross-building webkit2gtk is not worth the pain
        # (the same call reddb-io/reddb made for its aarch64 leg).
        include:
          - platform: blacksmith-8vcpu-ubuntu-2404
            triple: x86_64-unknown-linux-gnu
            args: ""
          - platform: blacksmith-8vcpu-ubuntu-2404-arm
            triple: aarch64-unknown-linux-gnu
            args: ""
          - platform: blacksmith-6vcpu-macos-15
            triple: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - platform: blacksmith-8vcpu-windows-2025
            triple: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      RED_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      RED_BUILD_GIT_SHA: ${{ github.sha }}
      # sccache object-cache (CARGO_INCREMENTAL must be 0 — incremental and
      # sccache are mutually exclusive). Harvested from reddb-io/reddb.
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Which of the two build steps below runs. The `secrets` context is not
      # available in a step `if:`, but it is in `env:`, so the decision is made
      # here and read back as a plain string.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install mold (linux link speedup)
        if: contains(matrix.platform, 'ubuntu')
        uses: rui314/setup-mold@v1

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Keyed by triple, not runner.os — the two Linux legs share an OS but
          # not an architecture, and one key would have them overwriting each
          # other's cache. The x86_64-linux key matches ci.yml's tauri job so
          # the release build warm-starts from CI's cache.
          shared-key: tauri-${{ matrix.triple }}-rust-1.95.0
          cache-on-failure: "true"

      - name: linux deps
        if: contains(matrix.platform, 'ubuntu')
        uses: ./.github/actions/tauri-linux-deps

      - run: pnpm install --frozen-lockfile

      # Build the SvelteKit bundle explicitly here, before tauri-action
      # invokes its own beforeBuildCommand. The first attempt failed
      # because tauri-action's path resolution didn't pick up the
      # bundle that beforeBuildCommand had just written (likely a
      # working-directory mismatch in the monorepo). Building once
      # ahead of time guarantees `packages/ui/build` exists when
      # tauri-action validates `frontendDist`.
      - name: build frontend (pwa bundle for embedding)
        run: pnpm --filter @reddb-io/ui build

      - name: verify frontend bundle
        shell: bash
        run: ls -la packages/ui/build/ && test -f packages/ui/build/index.html

      # Provision the `red` sidecar (Tauri externalBin) — gitignored, not
      # committed. fetch-sidecar.sh downloads the pinned release asset for
      # the build target, preferring the static musl build on Linux (no glibc
      # dependency), and verifies the sha256 checksum before placing it in
      # apps/desktop/src-tauri/binaries/red-<triple>.
      - name: provision red sidecar
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit, because the runner's host triple isn't always the build
          # target: the macOS leg builds universal-apple-darwin, for which the
          # script lipos both Darwin slices together.
          TAURI_TARGET_TRIPLE: ${{ matrix.triple }}
        run: bash scripts/fetch-sidecar.sh

      # Two build steps, differing only in whether the APPLE_* signing variables
      # are present at all. They can't be one step with empty values: the macOS
      # bundler branches on the variable *existing*, not on it being non-empty,
      # so an empty APPLE_CERTIFICATE makes it run `security import` on nothing
      # and fail the build ("failed to import keychain certificate"). Empty
      # TAURI_SIGNING_* and WINDOWS_CERTIFICATE are tolerated, so those stay put.
      - name: build tauri (unsigned — no Apple certificate configured)
        if: env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — empty values are tolerated by
          # tauri-action and produce unsigned builds (no autoUpdate).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows code signing
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "red-ui ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: build tauri (signed)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "red-ui ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Stage copies of tauri's versioned bundles under stable, version-free
      # names (red-ui-linux-x86_64.deb, …) so install.sh can fetch
      # .../releases/latest/download/<asset> without knowing the version.
      # Best-effort: a missing bundle warns instead of failing the release.
      - name: stage stable-named assets (for install.sh)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target="apps/desktop/src-tauri/target"
          staged=()
          stage() { # src stable-name
            if [ -n "$1" ] && [ -f "$1" ]; then
              cp "$1" "$2" && staged+=("$2")
            else
              echo "::warning::no bundle found for $2"
            fi
          }
          case "$(uname -s)" in
            Linux*)
              arch="$(uname -m)"
              stage "$(find "$target" -path '*/bundle/deb/*.deb' -print -quit)" "red-ui-linux-${arch}.deb"
              stage "$(find "$target" -path '*/bundle/appimage/*.AppImage' -print -quit)" "red-ui-linux-${arch}.AppImage"
              ;;
            Darwin*)
              # The macOS leg builds universal-apple-darwin — one dmg serves
              # both arches, so stage it under both stable names.
              dmg="$(find "$target" -path '*/bundle/dmg/*.dmg' -print -quit)"
              stage "$dmg" "red-ui-darwin-aarch64.dmg"
              stage "$dmg" "red-ui-darwin-x86_64.dmg"
              ;;
            MINGW*|MSYS*|CYGWIN*)
              stage "$(find "$target" -path '*/bundle/nsis/*-setup.exe' -print -quit)" "red-ui-windows-x86_64-setup.exe"
              ;;
          esac
          [ "${#staged[@]}" -gt 0 ] || { echo "::warning::nothing staged"; exit 0; }
          gh release upload "$TAG" "${staged[@]}" --clobber

  pwa-build:
    name: pwa · build + zip
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      RED_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      RED_BUILD_GIT_SHA: ${{ github.sha }}
    outputs:
      zip-name: ${{ steps.pack.outputs.zip-name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The "root" build is for the `red` binary to embed (BASE_PATH=''),
      # while the Pages build deploys under /red-ui (BASE_PATH=/red-ui).
      # We build both so the release ships an embeddable bundle AND
      # Pages always reflects the latest tag.
      - name: build pwa (root, for embedding)
        env:
          BASE_PATH: ""
        run: pnpm --filter @reddb-io/ui build

      - name: pack zip
        id: pack
        run: |
          name="red-ui-${{ github.ref_name }}-web.zip"
          (cd packages/ui/build && zip -r -q "$GITHUB_WORKSPACE/$name" .)
          echo "zip-name=$name" >> "$GITHUB_OUTPUT"

      # Attach the zipped bundle to the draft release the tauri matrix
      # opened (or create it if matrix hasn't run yet). softprops/action-gh-release
      # appends without overwriting.
      - name: attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip-name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          name: "red-ui ${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-bundle
          path: packages/ui/build

  # sha256 manifest over the stable-named assets (and the web zip), consumed
  # by install.sh's verify step. Runs after both producers so every asset is
  # already attached to the (draft) release. gh resolves draft releases by
  # tag for authenticated maintainers, so draft-then-publish keeps working.
  checksums:
    name: checksums.txt
    needs: [tauri, pwa-build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: build + upload checksums.txt
        run: |
          set -euo pipefail
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'red-ui-*' \
            || { echo "::warning::no red-ui-* assets on $TAG — skipping checksums"; exit 0; }
          sha256sum * > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --clobber --repo "$GITHUB_REPOSITORY"

  # Everything above uploads into a *draft* release, so a half-built tag is
  # never visible. This job is the gate that makes it real, and it only runs
  # when every platform in the matrix succeeded (`needs` requires success).
  #
  # Publishing is what makes the release installable at all: /releases/latest
  # and the releases API skip drafts, so install.sh, install.ps1 (and winget,
  # scoop, homebrew…) cannot see a tag until this step flips it.
  publish:
    name: publish · undraft
    needs: [tauri, pwa-build, checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: publish release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: assets
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

  # GitHub Pages deployment for https://ui.reddb.io is handled by
  # .github/workflows/pages.yml on pushes to main.
